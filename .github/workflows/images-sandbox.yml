name: images-sandbox

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "images/**"
      - "cmd/whaleshell-init/**"
      - "harden/**"
      - ".github/workflows/images-sandbox.yml"
  pull_request:
    paths:
      - "images/**"
      - "cmd/whaleshell-init/**"
      - "harden/**"
      - ".github/workflows/images-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # OpenShell-style: one image name per flavor under …/sandboxes/<name>
  IMAGE_PREFIX: ghcr.io/whaleshell/whaleshell/sandboxes
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cli
            name: base
          - target: gui
            name: gui
          - target: gpu
            name: gpu
    steps:
      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          path: whaleshell-runtime
      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main
      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main
      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build whaleshell-init into image context
        working-directory: whaleshell-runtime
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o images/sandbox/whaleshell-init ./cmd/whaleshell-init
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: whaleshell-runtime/images/sandbox
          file: whaleshell-runtime/images/sandbox/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
